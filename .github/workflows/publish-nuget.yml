name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      nuget_username:
        description: 'NuGet.org personal username who created the Trusted Publishing policy'
        required: false
        default: 'TeRiRi606'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test --no-build --configuration Release

    - name: Pack NuGet Packages
      run: |
        dotnet pack src/ShadcnBlazor/ShadcnBlazor.csproj -c Release -o nupkg
        dotnet pack src/ShadcnBlazor.Cli/ShadcnBlazor.Cli.csproj -c Release -o nupkg

    # Option A: Trusted Publishing via OIDC
    - name: NuGet Trusted Login
      if: env.NUGET_API_KEY == ''
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USERNAME || inputs.nuget_username || 'TeRiRi606' }}
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    # Option B: Push with API Key (if provided) or OIDC temporary token
    - name: Push Packages to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -n "$NUGET_API_KEY" ]; then
          dotnet nuget push nupkg/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
        else
          dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
        fi
