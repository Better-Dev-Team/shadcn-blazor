<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadcnBlazor Showcase</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="_content/BetterDev.ShadcnBlazor/shadcn-blazor.css" />
</head>

<body>
    <div id="app">
        <div class="flex min-h-screen items-center justify-center">
            <div class="flex flex-col items-center gap-3">
                <div class="h-8 w-8 animate-spin rounded-full border-2 border-primary border-t-transparent"></div>
                <div class="text-xs font-medium tracking-wide text-muted-foreground">Loading showcase...</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="fixed bottom-4 right-4 z-50 hidden rounded-lg border border-destructive bg-destructive/10 p-4 text-destructive shadow-lg">
        An unhandled error has occurred.
        <a href="." class="underline font-semibold ml-2">Reload</a>
    </div>

    <script src="_content/BetterDev.ShadcnBlazor/shadcn-blazor.js"></script>
    <script>
        (function () {
            var raw = localStorage.getItem('shadcn-blazor-theme');
            if (!raw) return;
            try {
                var state = JSON.parse(raw);
                var dark = state.mode === 'dark' ||
                    (state.mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                if (state.preset) document.documentElement.setAttribute('data-preset', state.preset);
                if (typeof state.radius === 'number') document.documentElement.style.setProperty('--radius', state.radius + 'rem');
            } catch (e) { }
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
