<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadcnBlazor - Beautifully designed components for Blazor</title>
    <base href="/" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Script CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                        mono: ['Geist Mono', 'monospace'],
                    },
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                        popover: {
                            DEFAULT: "hsl(var(--popover))",
                            foreground: "hsl(var(--popover-foreground))",
                        },
                        card: {
                            DEFAULT: "hsl(var(--card))",
                            foreground: "hsl(var(--card-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    }
                }
            }
        }
    </script>

    <!-- ShadcnBlazor CSS Design Tokens -->
    <link rel="stylesheet" href="_content/BetterDev.ShadcnBlazor/shadcn-blazor.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='black'/><path d='M208,128a80,80,0,1,1-80-80A80,80,0,0,1,208,128Z' fill='white'/></svg>" />
</head>

<body class="min-h-screen bg-background font-sans antialiased text-foreground selection:bg-primary selection:text-primary-foreground">
    <div id="app">
        <div class="flex h-screen w-screen items-center justify-center bg-background">
            <div class="flex flex-col items-center gap-3">
                <div class="h-8 w-8 animate-spin rounded-full border-2 border-primary border-t-transparent"></div>
                <div class="text-xs font-medium tracking-wide text-muted-foreground">Loading ShadcnBlazor...</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="fixed bottom-4 right-4 z-50 rounded-lg border border-destructive bg-destructive/10 p-4 text-destructive shadow-lg hidden">
        An unhandled error has occurred.
        <a href="." class="underline font-semibold ml-2">Reload</a>
    </div>

    <!-- ShadcnBlazor JavaScript Interop -->
    <script src="_content/BetterDev.ShadcnBlazor/shadcn-blazor.js"></script>
    <script>
        (function () {
            var raw = localStorage.getItem('shadcn-blazor-theme');
            if (!raw) return;
            try {
                var state = JSON.parse(raw);
                var dark = state.mode === 'dark' ||
                    (state.mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                if (state.preset) document.documentElement.setAttribute('data-preset', state.preset);
                if (typeof state.radius === 'number') document.documentElement.style.setProperty('--radius', state.radius + 'rem');
            } catch (e) {}
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
