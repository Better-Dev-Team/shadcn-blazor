name: Publish to NuGet (Trusted Publishing)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      nuget_username:
        description: 'NuGet.org username or organization owner (if not set in secrets.NUGET_USERNAME)'
        required: false
        default: 'Better-Dev-Team'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test --no-build --configuration Release

    - name: Pack NuGet Packages
      run: |
        dotnet pack src/ShadcnBlazor/ShadcnBlazor.csproj -c Release -o nupkg
        dotnet pack src/ShadcnBlazor.Cli/ShadcnBlazor.Cli.csproj -c Release -o nupkg

    - name: NuGet Trusted Login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USERNAME || inputs.nuget_username || 'Better-Dev-Team' }}

    - name: Push Packages to NuGet.org
      run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
